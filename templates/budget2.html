{% extends "layout.html" %}

{% block title %}
    Savings and Budget
{% endblock %}

{% block main %}
    <table class="table table-striped">
        <thead>
            <tr>
                <th scope="col"> Monthly Budget </th>
                <th scope="col"> Monthly Expenses </th>
                <th scope="col"> Monthly Savings </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td> ${{ monthly_budget }} </td>
                <td> ${{ monthly_expenses }} </td>
                <td> ${{ monthly_savings }} </td>
            </tr>
        </tbody>
    </table>
{% endblock %}
